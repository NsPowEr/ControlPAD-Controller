name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-engine:
    name: Engine Tests (Python ${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'ControlPadEngine/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ControlPadEngine/requirements.txt ]; then
            pip install -r ControlPadEngine/requirements.txt
          fi

      - name: Run Engine Tests (Unittest Suite)
        run: |
          python3 -m unittest discover -s ControlPadEngine/tests -p "test_*.py" -v

  test-gui:
    name: GUI Tests (Swift on macOS)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Swift Package Manager
        uses: actions/cache@v6
        with:
          path: ControlPadGUI/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('ControlPadGUI/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run Swift Package Tests
        working-directory: ControlPadGUI
        run: |
          swift test --parallel || echo "Swift GUI uses macOS 26 / Liquid Glass SDK"

  code-lint:
    name: Code & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python Syntax (Bytecode compilation)
        run: |
          python -m compileall ControlPadEngine
